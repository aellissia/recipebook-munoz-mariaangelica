{% extends "base.html" %}

{% block content %}
<h2>Upload Recipe Image</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Upload">
</form>
<a href="{% url 'ledger:recipe_detail' pk=recipe_pk %}">Back to Recipe</a>
{% endblock %}
