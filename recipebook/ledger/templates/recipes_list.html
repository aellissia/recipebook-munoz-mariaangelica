{% extends 'base.html' %}

{% block content %}
{% if user.is_authenticated %}
    <a href="{% url 'ledger:recipe_add' %}">Add New Recipe</a>
{% endif %}
    <ul>
    {% for recipe in recipes %}
        <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
